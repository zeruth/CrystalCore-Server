# crystal-server configuration. Every key can be overridden by an environment variable:
# CRYSTAL_<SECTION>__<KEY>, e.g. CRYSTAL_STATE__REDIS_URL, CRYSTAL_DATABASE__LOGIN__URL.
# Defaults run everything in one process on SQLite with in-process state; a hosted setup uses
# PostgreSQL and Redis (tools/dev.ps1 runs both locally).

roles = ["lobby", "zone"]

[log]
filter = "info"

[database]
auto_migrate = true

[database.login]
url = "sqlite:var/login.db?mode=rwc"
# url = "postgres://crystal@127.0.0.1:5432/crystal_login"

[database.characters]
url = "sqlite:var/characters.db?mode=rwc"
# url = "postgres://crystal@127.0.0.1:5432/crystal_characters"

[database.world]
url = "sqlite:var/world.db?mode=rwc"
# url = "postgres://crystal@127.0.0.1:5432/crystal_world"

[state]
prefix = "crystal"
# redis_url = "redis://127.0.0.1:6379"

[lobby]
# The client's two lobby hosts, each feeding one region of the world list (01: JP, 02: NA/EU).
# Point the client's DEV.LobbyPort01 at `bind` and DEV.LobbyPort02 at `bind_2`. `create_host` shows
# the Lobby world, where characters are made (and not played); the other shows Crystal, to play
# on. Without `bind_2`, both hosts share `bind` and both regions show Crystal.
bind = "127.0.0.1:54994"
bind_2 = "127.0.0.1:54995"
create_host = 1

[data]
# The client install's `game` folder: zone exits and other game data are read from it.
# game = "C:/Users/tyler/Documents/code/CrystalCore/archive/installs/beta-672261/game"

[zone]
# Also the address game login sends the client to.
bind = "127.0.0.1:54992"
# capture_dir = "protocol/672261/captures"
