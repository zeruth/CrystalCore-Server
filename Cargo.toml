[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
crystal-common = { path = "crates/crystal-common" }
crystal-db = { path = "crates/crystal-db" }
crystal-lobby = { path = "crates/crystal-lobby" }
crystal-net = { path = "crates/crystal-net" }
crystal-runtime = { path = "crates/crystal-runtime" }
crystal-state = { path = "crates/crystal-state" }
crystal-zone = { path = "crates/crystal-zone" }

anyhow = "1"
bytes = "1"
clap = { version = "4.6", features = ["derive"] }
figment = { version = "0.10", features = ["toml", "env"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
hex = "0.4"
md-5 = "0.10"
mimalloc = "0.1"
parking_lot = "0.12"
redis = { version = "1.8", default-features = false, features = ["tokio-comp", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "any", "postgres", "sqlite", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
